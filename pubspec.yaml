name: shuddha_sangeetham
description: Shuddha Sangeetham — Offline Carnatic music reference app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Database — drift (SQLite ORM with type-safe queries)
  drift: ^2.19.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Storage & path utilities
  path_provider: ^2.1.3
  path: ^1.9.0

  # Shared preferences (theme override persistence)
  shared_preferences: ^2.3.2

  # URL launcher (karnatik.com links)
  url_launcher: ^6.3.0

  # HTTP client — delta sync API calls
  http: ^1.2.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.14.0
  drift_dev: ^2.19.0
  riverpod_generator: ^3.0.0

  # Native SQLite for unit tests (NativeDatabase.memory())
  sqlite3: ^2.4.6

  # Lints
  flutter_lints: ^4.0.0

  # App icon generation — run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

  # Splash screen generation — run: dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ss_logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#00695C"
  adaptive_icon_foreground: "assets/images/ss_logo.jpg"
  web:
    generate: false

flutter_native_splash:
  color: "#00695C"
  image: assets/images/ss_logo.jpg
  color_dark: "#121212"
  image_dark: assets/images/ss_logo.jpg
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/ss_logo.jpg
    - assets/db/shuddha_sangeetham.db
